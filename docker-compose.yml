services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b_emv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emv_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emv_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-b2b_emv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emv_admin} -d ${POSTGRES_DB:-b2b_emv}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
